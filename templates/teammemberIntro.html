<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>우리 팀 소개</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>우리 팀을 소개합니다!</h1>
    <div class="team-container">
        {% for member in team %}
        <div class="member">
            <img src="{{ member.image }}" alt="{{ member.name }}">
            <h2>{{ member.name }}</h2>
            <p>{{ member.role }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
